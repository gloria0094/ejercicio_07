server.port=8080

spring.datasource.url=jdbc:h2:mem:entrenadores;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Desactivar por completo el escaneo de HATEOAS en Swagger para evitar el choque de clases
springdoc.model-converters.deprecate-fields=false
springdoc.api-docs.enabled=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true